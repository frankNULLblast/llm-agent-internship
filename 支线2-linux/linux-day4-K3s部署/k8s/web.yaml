apiVersion: v1
kind: Namespace
metadata:
  name: linux-lab
  labels:
    app.kubernetes.io/part-of: linux-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: linux-lab-web
  namespace: linux-lab
  labels:
    app.kubernetes.io/name: linux-lab-web
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: linux-lab-web
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: linux-lab-web
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: localhost/linux-lab-web:0.1
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: linux-lab-web
  namespace: linux-lab
  labels:
    app.kubernetes.io/name: linux-lab-web
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: linux-lab-web
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
      nodePort: 30080
